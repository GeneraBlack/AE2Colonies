name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version Type (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ae2colonies-jar
          path: build/libs/*.jar

      - name: Publish to CurseForge & GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_ID || secrets.CURSEFORGE_PROJECT_ID || secrets.CURSE_ID || secrets.CURSE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN || secrets.CURSE_TOKEN || secrets.CF_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21
          version-type: ${{ inputs.version_type || 'release' }}
          dependencies: |
            applied-energistics-2(required)
            minecolonies(required)
            guideme(required)
            domum-ornamentum(required)